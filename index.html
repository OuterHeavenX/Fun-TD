<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#18243a">
<title>FUN TD — Swarm Defense</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<main id="app">
  <canvas id="game" aria-label="FUN TD battlefield"></canvas>
  <header id="hud">
    <div class="progress-shell">
      <div id="progressFill"></div>
      <div class="progress-label"><span>ENEMIES DEFEATED</span><b id="progressText">0 / 0</b></div>
    </div>
    <div class="gold-pill"><span class="coin">●</span><b id="gold">600</b></div>
  </header>
  <div id="subhud"><span>WAVE <b id="wave">1</b>/20</span><span>BASE <b id="hp">100</b></span></div>
  <div id="toast"></div>
  <div id="towerMenu" class="panel hidden"></div>
  <button id="startWave" class="start-wave">START WAVE 1</button>
  <div id="cornerControls"><button id="speed">1×</button><button id="pause">Ⅱ</button><button id="sound">♪</button></div>
  <div id="intro" class="modal">
    <section>
      <div class="eyebrow">DUSTWALL DEFENSE</div>
      <h1>FUN <em>TD</em></h1>
      <p>Build. Blast the swarm. Upgrade. Repeat.</p>
      <button id="play">DEFEND THE BASE</button>
    </section>
  </div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
